name: Merge Dependabot PRs

on:
  schedule:
    - cron: '0 11 * * 1' # Every Monday at 11am UTC
  workflow_dispatch: {} # Manual trigger for testing

jobs:
  merge-dependabot-prs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Claude Code
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.HANDS_UP_GITHUB_TOKEN }}
        run: |
          claude -p \
            --model claude-sonnet-4-6 \
            --allowedTools 'Bash(*)' \
            --dangerously-skip-permissions \
            "$(cat <<'PROMPT'
          You are an automated dependency update bot for the Hands Up Education org.
          Your job is to get ALL open Dependabot PRs merged. Do not skip any PRs — fix whatever is blocking them.

          IMPORTANT: Write a detailed Markdown report to /tmp/dependabot-report.md as you go.
          Use tee -a /tmp/dependabot-report.md or write to it directly. The report should follow this structure:

          # Dependabot PR Merge Report — <today's date>

          ## Summary
          - **Total PRs found**: X
          - **Merged**: X
          - **Needed fixes**: X
          - **Needs manual intervention**: X

          ## Per-repo details

          ### <repo-name>
          | PR | Title | Status | Notes |
          |----|-------|--------|-------|
          | #N | ...   | ✅ Merged / ⚠️ Needs intervention | ... |

          ## Actions taken
          - <describe any conflict resolutions, test fixes, etc.>

          ## Manual intervention required
          - <if any, with detailed reasons>

          ## Repos to check

          Iterate through each of these repos in the hands-up-education org:
          - hue-frontend
          - hue-account
          - hue-infrastructure
          - suburani-api
          - hue-docs
          - hue-claude-plugin

          ## For each repo

          1. List all open PRs authored by dependabot[bot] or app/dependabot.
             Run both queries, combine the results, and deduplicate by PR number before processing:
             gh pr list --repo hands-up-education/<repo> --author "app/dependabot" --state open --json number,title,mergeable,mergeStateStatus,statusCheckRollup,headRefName,baseRefName --limit 50
             gh pr list --repo hands-up-education/<repo> --author "dependabot[bot]" --state open --json number,title,mergeable,mergeStateStatus,statusCheckRollup,headRefName,baseRefName --limit 50

          2. For each Dependabot PR, assess its state and take action:

             If the PR has merge conflicts:
             - Clone the repo: gh repo clone hands-up-education/<repo> /tmp/<repo>
             - Check out the Dependabot branch and rebase it onto the base branch (usually main)
             - Resolve any merge conflicts sensibly (accept the dependency update where possible)
             - Force-push the rebased branch back to the PR
             - Wait for checks to start running

             If checks are failing:
             - Examine the failing check logs: gh pr checks <number> --repo hands-up-education/<repo>
             - For test failures, clone the repo (if not already), check out the branch, and fix the failing tests or code to be compatible with the updated dependency
             - Push the fixes and wait for checks to re-run
             - Re-check until all checks pass

             If checks are pending:
             - Wait briefly and re-check. If checks remain pending after a reasonable wait, proceed with --auto merge which will merge once checks complete.

             Once the PR is clean (mergeable + checks passing or pending):
             - Merge the PR:
               gh pr merge <number> --repo hands-up-education/<repo> --squash --auto
               Use --squash to keep commit history clean, and --auto so it merges once branch protection requirements are satisfied.

          3. If after multiple attempts a PR truly cannot be fixed (e.g. the dependency update introduces a major breaking change requiring significant refactoring), log it as needing manual intervention with a detailed explanation of what went wrong.

          ## Summary

          After processing all repos, output a summary listing:
          - PRs merged per repo (with PR titles)
          - PRs that needed conflict resolution or fix-ups (and what was done)
          - PRs that need manual intervention (if any, with detailed reasons)
          - Total PRs merged across all repos
          PROMPT
          )"

      - name: Upload merge report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependabot-merge-report
          path: /tmp/dependabot-report.md
          retention-days: 30
