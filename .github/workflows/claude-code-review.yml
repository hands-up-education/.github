name: Claude Code Review

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  # Resolves the actor's permission BEFORE the review job exists, so an
  # unauthorized `/claude-review` comment never joins claude-review's
  # concurrency group and can't cancel an in-flight legitimate run.
  authorize:
    if: |
      (
        github.event.pull_request &&
        github.actor != 'dependabot[bot]'
      ) ||
      (
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '/claude-review') &&
        github.actor != 'dependabot[bot]'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      authorized: ${{ steps.check.outputs.authorized }}
    steps:
      - name: Check commenter has write access
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # pull_request(opened) is scoped to the PR the actor themselves just
          # opened; the risk this job guards against - an outsider's comment
          # hijacking the concurrency group of someone else's running review -
          # only exists for issue_comment.
          if [ "$EVENT_NAME" != "issue_comment" ]; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq .permission)
          echo "commenter permission: $permission"
          if [ "$permission" = "admin" ] || [ "$permission" = "write" ]; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
          else
            echo "authorized=false" >> "$GITHUB_OUTPUT"
          fi

  claude-review:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR: ${{ github.event.pull_request.number || github.event.issue.number }}
    concurrency:
      group: claude-review-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: React with eyes emoji
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'issue_comment') {
              await github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id,
                content: 'eyes'
              });
            } else if (context.eventName === 'pull_request' || context.eventName === 'pull_request_target') {
              await github.rest.reactions.createForIssue({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                content: 'eyes'
              });
            }

      # issue_comment carries no ref/SHA for the PR at all - the ambient
      # checkout ref would be main, not the code under review - and even for
      # pull_request the default ref is a synthetic merge-preview commit.
      # Resolve the actual head SHA once, trusted-side, and pin the checkout
      # to it so Read/Grep see exactly the commit the diff below describes.
      - name: Resolve PR head SHA
        id: pr-head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$PR" =~ ^[0-9]+$ ]]; then
            echo "::error::PR is not numeric: $PR"
            exit 1
          fi
          sha=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve a 40-char head SHA for PR $PR (got: $sha)"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.pr-head.outputs.sha }}
          fetch-depth: 1
          # The model never runs git itself (see below), so no history is
          # needed beyond this one commit. persist-credentials stops
          # actions/checkout from adding its own token-bearing header; the
          # action's own git setup still embeds a token in .git/config's
          # remote URL regardless (verified against upstream git-config.ts -
          # replaceCheckoutCredentials always sets one unless the unrelated,
          # and separately dangerous, allowed_non_write_users input is set).
          # That's why .git/** is also denied to Read/Grep/Glob below -
          # persist-credentials alone does not close this off.
          persist-credentials: false

      # A trusted step fetches the diff and changed-file list via the API,
      # not the model: the model gets no git/gh access to the diff itself,
      # only Read/Grep/Glob over these files and the checked-out tree.
      - name: Write PR diff and changed-file list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .claude-review-context
          gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" > .claude-review-context/diff.patch
          gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only > .claude-review-context/changed-files.txt

      # The prompt is the review instructions directly, not a /code-review
      # slash command: the CLI's built-in skills (code-review included) are
      # never registered in the SDK's headless session that the action runs
      # (anthropics/claude-code#9954 - <available_skills> is empty outside
      # the interactive app), so a slash-command prompt matches no skill and
      # the run ends at num_turns: 0 with every tool call denied.
      #
      # allowedTools is the actual security boundary, not the prompt text:
      # Read/Grep/Glob for investigating the already-checked-out diff and
      # code, the inline-comment MCP tool (server-side scoped to this PR's
      # number), and one exact-PR-number Bash prefix for the summary
      # comment - no generic git, no gh api, no gh pr view/diff. .git/** is
      # denied on top of that so the token the action embeds in the remote
      # URL (see the checkout step above) can't be read back out.
      #
      # There's no skill turn to control, so --json-schema could satisfy
      # the gate directly, but tagging each inline comment with its
      # category and counting them via the GitHub API keeps findings
      # visible on the PR as they're posted rather than buffered into one
      # opaque final payload.
      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          classify_inline_comments: 'false'
          prompt: |
            Review PR ${{ env.PR }} at high effort. Read .claude-review-context/diff.patch for the full diff and .claude-review-context/changed-files.txt for the list of changed files, then read whatever surrounding code and related files you need (Read, Grep, Glob) to catch correctness bugs, reuse/simplification opportunities, and efficiency issues. Investigate broadly - this is a high-effort pass, not a skim of the diff alone.

            For every finding, post an inline PR review comment on the exact line with mcp__github_inline_comment__create_inline_comment. Start each comment body with the finding's category in square brackets, for example [correctness] or [simplification].

            When finished, including when there are no findings, post exactly one PR comment with: gh pr comment ${{ env.PR }} --body <text>. That comment must start with the heading '## Claude code review', end the first line with the marker `<!-- run:${{ github.run_id }} -->`, and list the number of findings per category. End the comment with the line 'Fix the findings and comment /claude-review to request a re-review.'
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment ${{ env.PR }}:*)"
            --disallowedTools "Read(**/.git/**)"

      - name: Fail on correctness findings
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
          HEAD_SHA: ${{ steps.pr-head.outputs.sha }}
          RUN_MARKER: "<!-- run:${{ github.run_id }} -->"
        run: |
          if [ -n "$EXECUTION_FILE" ] && [ -f "$EXECUTION_FILE" ]; then
            result=$(jq '[.[] | select(.type == "result")] | last' "$EXECUTION_FILE")
            num_turns=$(jq -r '.num_turns // -1' <<<"$result")
            denials=$(jq -r '(.permission_denials // []) | length' <<<"$result")
            if [ "$num_turns" = "0" ]; then
              echo "::error::Claude Code completed 0 turns ($denials tool call(s) denied) - it never read the diff or posted a finding, so no summary can exist. Check --allowedTools covers every tool the review prompt uses."
              exit 1
            fi
          fi

          # --paginate applies --jq per page, so a review spanning multiple
          # comment pages would otherwise yield one length per page (e.g.
          # "1\n0") instead of one total; --slurp wraps all pages into a
          # single outer array first so `.[][]` flattens to one number.
          # gh rejects --slurp combined with its own --jq, so pipe to jq.
          summaries=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$PR/comments" | \
            jq --arg marker "$RUN_MARKER" \
            '[.[][] | select(.user.login == "claude[bot]" and (.body | startswith("## Claude code review")) and (.body | contains($marker)))] | length')
          if ! [[ "$summaries" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not parse the summary-comment count from the GitHub API response: '$summaries'"
            exit 1
          fi
          if [ "$summaries" -eq 0 ]; then
            echo "::error::No summary comment for this run ($RUN_MARKER) was found - either the review did not complete, or it completed without the required run marker."
            exit 1
          fi

          correctness=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR/comments" | \
            jq --arg sha "$HEAD_SHA" \
            '[.[][] | select(.user.login == "claude[bot]" and .commit_id == $sha and (.body | startswith("[correctness]")))] | length')
          if ! [[ "$correctness" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not parse the correctness-finding count from the GitHub API response: '$correctness'"
            exit 1
          fi
          echo "correctness findings on $HEAD_SHA: $correctness"
          if [ "$correctness" -gt 0 ]; then
            echo "::error::Claude found $correctness correctness issue(s). Fix them and comment /claude-review on the PR to re-run this check."
            exit 1
          fi
