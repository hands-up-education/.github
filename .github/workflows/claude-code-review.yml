name: Claude Code Review

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  claude-review:
    if: |
      (
        github.event.pull_request &&
        github.actor != 'dependabot[bot]'
      ) ||
      (
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '/claude-review') &&
        github.actor != 'dependabot[bot]'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: claude-review-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: React with eyes emoji
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'issue_comment') {
              await github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id,
                content: 'eyes'
              });
            } else if (context.eventName === 'pull_request' || context.eventName === 'pull_request_target') {
              await github.rest.reactions.createForIssue({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                content: 'eyes'
              });
            }

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Built-in /code-review skill (same one used locally) rather than the
      # code-review plugin: it takes an effort level, has no silent skip
      # logic, and avoids the per-finding validation fan-out that pushed
      # large PRs past 15 minutes. --allowedTools must name the inline
      # comment tool or the action never starts that MCP server.
      #
      # The skill controls its own final turn, so --json-schema is never
      # satisfied. Instead the system prompt makes each inline comment
      # carry a [category] tag and adds one summary comment, and the gate
      # step below counts those through the GitHub API. Inline comments
      # are posted immediately rather than buffered through the action's
      # Haiku classifier so the count is not subject to a second model.
      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          classify_inline_comments: 'false'
          prompt: "/code-review high --comment ${{ github.event.pull_request.number || github.event.issue.number }}"
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh api:*)"
            --append-system-prompt "Start every inline PR comment body with the finding's category in square brackets, for example [correctness] or [simplification]. After the inline comments are posted, or when there are no findings, post exactly one PR comment with: gh pr comment ${{ github.event.pull_request.number || github.event.issue.number }} --body <text>. That comment must start with the heading '## Claude code review', list the number of findings per category, and end with the line 'Fix the findings and comment /claude-review to request a re-review.'"

      - name: Fail on correctness findings
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          summaries=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '[.[] | select(.user.login == "claude[bot]" and (.body | startswith("## Claude code review")))] | length')
          if [ "$summaries" -eq 0 ]; then
            echo "::error::The review posted no summary comment, so it did not complete. Comment /claude-review on the PR to re-run."
            exit 1
          fi
          head=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
          correctness=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/comments" \
            --jq "[.[] | select(.user.login == \"claude[bot]\" and .commit_id == \"$head\" and (.body | startswith(\"[correctness]\")))] | length")
          echo "correctness findings on $head: $correctness"
          if [ "$correctness" -gt 0 ]; then
            echo "::error::Claude found $correctness correctness issue(s). Fix them and comment /claude-review on the PR to re-run this check."
            exit 1
          fi
