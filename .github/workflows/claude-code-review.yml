name: Claude Code Review

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  claude-review:
    if: |
      (
        github.event.pull_request &&
        github.actor != 'dependabot[bot]'
      ) ||
      (
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '/claude-review') &&
        github.actor != 'dependabot[bot]'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR: ${{ github.event.pull_request.number || github.event.issue.number }}
    concurrency:
      group: claude-review-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: React with eyes emoji
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'issue_comment') {
              await github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id,
                content: 'eyes'
              });
            } else if (context.eventName === 'pull_request' || context.eventName === 'pull_request_target') {
              await github.rest.reactions.createForIssue({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                content: 'eyes'
              });
            }

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # The prompt is the review instructions directly, not a /code-review
      # slash command: the CLI's built-in skills (code-review included) are
      # never registered in the SDK's headless session that the action runs
      # (anthropics/claude-code#9954 - <available_skills> is empty outside
      # the interactive app), so a slash-command prompt matches no skill and
      # the run ends at num_turns: 0 with every tool call denied. Writing
      # the instructions inline also means --allowedTools has to name every
      # tool the review itself needs (Read/Grep/Glob/git) and not just the
      # posting tools - agent mode grants nothing beyond what's listed here.
      #
      # There's no skill turn to control, so --json-schema could satisfy
      # the gate directly, but tagging each inline comment with its
      # category and counting them via the GitHub API keeps findings
      # visible on the PR as they're posted rather than buffered into one
      # opaque final payload.
      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          classify_inline_comments: 'false'
          prompt: |
            Review PR ${{ env.PR }} at high effort. Fetch its diff with `gh pr diff ${{ env.PR }}`, then read whatever surrounding code, history and related files you need (Read, Grep, Glob, git log, git show) to catch correctness bugs, reuse/simplification opportunities, and efficiency issues. Investigate broadly - this is a high-effort pass, not a skim of the diff alone.

            For every finding, post an inline PR review comment on the exact line with mcp__github_inline_comment__create_inline_comment. Start each comment body with the finding's category in square brackets, for example [correctness] or [simplification].

            When finished, including when there are no findings, post exactly one PR comment with: gh pr comment ${{ env.PR }} --body <text>. That comment must start with the heading '## Claude code review', list the number of findings per category, and end with the line 'Fix the findings and comment /claude-review to request a re-review.'
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*),mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh api:*)"

      - name: Fail on correctness findings
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          if [ -n "$EXECUTION_FILE" ] && [ -f "$EXECUTION_FILE" ]; then
            result=$(jq '[.[] | select(.type == "result")] | last' "$EXECUTION_FILE")
            num_turns=$(jq -r '.num_turns // -1' <<<"$result")
            denials=$(jq -r '.permission_denials_count // 0' <<<"$result")
            if [ "$num_turns" = "0" ]; then
              echo "::error::Claude Code completed 0 turns ($denials tool call(s) denied) - it never read the diff or posted a finding, so no summary can exist. Check --allowedTools covers every tool the review prompt uses."
              exit 1
            fi
          fi
          summaries=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '[.[] | select(.user.login == "claude[bot]" and (.body | startswith("## Claude code review")))] | length')
          if [ "$summaries" -eq 0 ]; then
            echo "::error::The review posted no summary comment, so it did not complete. Comment /claude-review on the PR to re-run."
            exit 1
          fi
          head=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
          correctness=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/comments" \
            --jq "[.[] | select(.user.login == \"claude[bot]\" and .commit_id == \"$head\" and (.body | startswith(\"[correctness]\")))] | length")
          echo "correctness findings on $head: $correctness"
          if [ "$correctness" -gt 0 ]; then
            echo "::error::Claude found $correctness correctness issue(s). Fix them and comment /claude-review on the PR to re-run this check."
            exit 1
          fi
