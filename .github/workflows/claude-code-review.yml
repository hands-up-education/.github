name: Claude Code Review

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  # Resolves the actor's permission BEFORE the review job exists, so an
  # unauthorized `/claude-review` comment never joins claude-review's
  # concurrency group and can't cancel an in-flight legitimate run.
  authorize:
    if: |
      (
        github.event.pull_request &&
        github.actor != 'dependabot[bot]'
      ) ||
      (
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '/claude-review') &&
        github.actor != 'dependabot[bot]'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      authorized: ${{ steps.check.outputs.authorized }}
    steps:
      - name: Check commenter has write access
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # pull_request(opened) is scoped to the PR the actor themselves just
          # opened; the risk this job guards against - an outsider's comment
          # hijacking the concurrency group of someone else's running review -
          # only exists for issue_comment.
          if [ "$EVENT_NAME" != "issue_comment" ]; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq .permission)
          echo "commenter permission: $permission"
          if [ "$permission" = "admin" ] || [ "$permission" = "write" ]; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
          else
            echo "authorized=false" >> "$GITHUB_OUTPUT"
          fi

  claude-review:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR: ${{ github.event.pull_request.number || github.event.issue.number }}
    concurrency:
      group: claude-review-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: React with eyes emoji
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'issue_comment') {
              await github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id,
                content: 'eyes'
              });
            } else if (context.eventName === 'pull_request' || context.eventName === 'pull_request_target') {
              await github.rest.reactions.createForIssue({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                content: 'eyes'
              });
            }

      # Captured once, used everywhere below (checkout, diff, the inline
      # comments' commit_id, and the final re-check) so a push mid-review
      # can't make the diff, the comments and the gate disagree about which
      # commit is under review. issue_comment carries no ref/SHA for the PR
      # at all - the ambient checkout ref would be main - and even for
      # pull_request the default ref is a synthetic merge-preview commit.
      - name: Resolve PR base and head SHAs
        id: pr-sha
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! [[ "$PR" =~ ^[0-9]+$ ]]; then
            echo "::error::PR is not numeric: $PR"
            exit 1
          fi
          read -r head base < <(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid,baseRefOid --jq '.headRefOid + " " + .baseRefOid')
          for sha in "$head" "$base"; do
            if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Could not resolve a 40-char SHA for PR $PR (got: '$head' '$base')"
              exit 1
            fi
          done
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.pr-sha.outputs.head }}
          fetch-depth: 1
          # persist-credentials stops actions/checkout from adding its own
          # token-bearing header; the action's own git setup still embeds a
          # token in .git/config's remote URL regardless (verified against
          # upstream git-config.ts - replaceCheckoutCredentials always sets
          # one unless the unrelated, and separately dangerous,
          # allowed_non_write_users input is set). That's why .git/** is
          # also denied to Read/Grep/Glob below - persist-credentials alone
          # does not close this off. The next step's own fetch passes its
          # own auth inline (URL-embedded) rather than relying on this.
          persist-credentials: false

      # A trusted step fetches the base commit and generates the diff and
      # changed-file list with git directly, pinned to the two SHAs
      # captured above (not the live PR, which could have moved).
      # GitHub's compare API caps the file list at 300 and can truncate the
      # diff itself on a large PR, silently hiding files - git has no such
      # cap. The fetch URL carries the token inline rather than persisting
      # it to .git/config (nothing is written to disk - verified locally:
      # `git fetch <url-with-token> <sha>` adds no remote and leaves
      # .git/config unchanged). Output goes under a freshly created
      # $RUNNER_TEMP directory, never a PR-controlled path: the checked-out
      # tree can contain a symlink at a predictable name, and `>` follows
      # symlinks, so a trusted write through a PR-chosen path could be
      # redirected to overwrite any runner-writable file. mktemp's name
      # isn't guessable in advance, so nothing in the PR can pre-place one.
      - name: Write PR diff and changed-file list
        id: pr-context
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ steps.pr-sha.outputs.head }}
          BASE: ${{ steps.pr-sha.outputs.base }}
        run: |
          set -euo pipefail
          dir=$(mktemp -d "$RUNNER_TEMP/claude-review-context.XXXXXX")
          git fetch --depth 1 "https://x-access-token:${GH_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git" "$BASE"
          git diff "$BASE" "$HEAD" > "$dir/diff.patch"
          git diff --name-only "$BASE" "$HEAD" > "$dir/changed-files.txt"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      # Ground truth for "did this run actually post anything" below: any
      # review comment by claude[bot] created at or after this timestamp is
      # from this run, regardless of what the model's own summary claims.
      - name: Record review start time
        id: run-start
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # The prompt is the review instructions directly, not a /code-review
      # slash command: the CLI's built-in skills (code-review included) are
      # never registered in the SDK's headless session that the action runs
      # (anthropics/claude-code#9954 - <available_skills> is empty outside
      # the interactive app), so a slash-command prompt matches no skill and
      # the run ends at num_turns: 0 with every tool call denied.
      #
      # allowedTools is the actual security boundary, not the prompt text,
      # and the model gets no Bash at all: a Bash rule scoped to `gh pr
      # comment <PR>` still lets `gh` itself read an arbitrary file via
      # `--body-file` (e.g. .git/config, where a token can end up) or
      # target another PR/repo via `--repo`/`--edit-last` - none of that is
      # stopped by restricting the PR number in the prefix, since gh, not
      # Claude's Read tool, does the reading. So there is no comment-
      # posting tool for the model at all; it can only post inline findings
      # (mcp__github_inline_comment__create_inline_comment - fixed
      # server-side to this PR's repo and number, no path/repo/PR
      # parameters it could redirect) and its plain final response becomes
      # the summary, posted and verified by a trusted step below.
      # Read/Grep/Glob remain, scoped away from .git/** so a token can't be
      # read back out (Claude Code applies Read deny rules to Grep/Glob
      # too); granted bare (no path scope), Read also reaches $RUNNER_TEMP
      # above despite that being outside the checked-out working directory.
      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          classify_inline_comments: 'false'
          prompt: |
            Review PR ${{ env.PR }} at high effort. Read ${{ steps.pr-context.outputs.dir }}/diff.patch for the full diff and ${{ steps.pr-context.outputs.dir }}/changed-files.txt for the list of changed files, then read whatever surrounding code and related files you need (Read, Grep, Glob) to catch correctness bugs, reuse/simplification opportunities, and efficiency issues. Investigate broadly - this is a high-effort pass, not a skim of the diff alone.

            For every finding, post an inline PR review comment on the exact line with mcp__github_inline_comment__create_inline_comment. Start each comment body with the finding's category in square brackets, for example [correctness] or [simplification]. Always pass commit_id: "${{ steps.pr-sha.outputs.head }}" on every call - never omit it and never use a different value.

            You have no tool to post a summary comment yourself. Instead, your FINAL message in this conversation - nothing before or after it - must be exactly the summary text, in this exact order:
            1. The heading '## Claude code review'
            2. A line with exactly this format, filled in truthfully: `<!-- findings: correctness=N total=M -->` where N is the number of [correctness] findings and M is the total number of findings you posted (both 0 if none)
            3. The findings per category
            4. The line 'Fix the findings and comment /claude-review to request a re-review.'
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Read(**/.git/**)"

      # Trusted-side posting: the model's final response text becomes the
      # comment body verbatim (plus the run marker), posted with the
      # workflow's own token via --body-file, never a value the model
      # could turn into `--repo`/`--edit-last`/an arbitrary read.
      - name: Post review summary
        id: post-summary
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
          RUN_MARKER: "<!-- run:${{ github.run_id }} -->"
        run: |
          set -euo pipefail
          if [ -z "$EXECUTION_FILE" ] || [ ! -f "$EXECUTION_FILE" ]; then
            echo "::error::No execution output from Claude Code Review - nothing to post."
            exit 1
          fi
          result=$(jq '[.[] | select(.type == "result")] | last' "$EXECUTION_FILE")
          num_turns=$(jq -r '.num_turns // -1' <<<"$result")
          denials=$(jq -r '(.permission_denials // []) | length' <<<"$result")
          if [ "$num_turns" = "0" ]; then
            echo "::error::Claude Code completed 0 turns ($denials tool call(s) denied) - it never read the diff or posted a finding, so no summary can exist. Check --allowedTools covers every tool the review prompt uses."
            exit 1
          fi
          summary=$(jq -r '.result // ""' <<<"$result")
          if [ -z "$summary" ] || [[ "$summary" != "## Claude code review"* ]]; then
            echo "::error::Claude's final message wasn't a summary starting with '## Claude code review' - got: ${summary:0:200}"
            exit 1
          fi

          marker=$(grep -oE '<!-- findings: correctness=[0-9]+ total=[0-9]+ -->' <<<"$summary" | head -1)
          if [ -z "$marker" ]; then
            echo "::error::Claude's summary is missing the required findings marker (expected a line like '<!-- findings: correctness=0 total=0 -->')."
            exit 1
          fi
          echo "correctness_declared=$(grep -oE 'correctness=[0-9]+' <<<"$marker" | grep -oE '[0-9]+')" >> "$GITHUB_OUTPUT"
          echo "total_declared=$(grep -oE 'total=[0-9]+' <<<"$marker" | grep -oE '[0-9]+')" >> "$GITHUB_OUTPUT"

          body_file=$(mktemp "$RUNNER_TEMP/claude-review-summary.XXXXXX")
          printf '%s\n\n%s\n' "$summary" "$RUN_MARKER" > "$body_file"
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$body_file"

      # The summary marker above is the model's own claim; everything here
      # is independently verified so a wrong or dishonest claim can't pass.
      - name: Fail on correctness findings
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
          HEAD_SHA: ${{ steps.pr-sha.outputs.head }}
          RUN_START: ${{ steps.run-start.outputs.time }}
          CORRECTNESS_DECLARED: ${{ steps.post-summary.outputs.correctness_declared }}
          TOTAL_DECLARED: ${{ steps.post-summary.outputs.total_declared }}
        run: |
          set -euo pipefail
          current_head=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          if [ "$current_head" != "$HEAD_SHA" ]; then
            echo "::error::PR changed during review (was $HEAD_SHA, now $current_head) - re-run /claude-review."
            exit 1
          fi

          # A failed post attempt (e.g. GitHub 422s a stale line) still
          # returns isError to the model without failing the session, so a
          # finding can vanish without tripping num_turns or the summary
          # check. tool_use ids of every inline-comment call, then any
          # tool_result answering one of those ids with is_error true.
          post_errors=$(jq '
            ( [ .[] | select(.type=="assistant") | .message.content[]? |
                select(.type=="tool_use" and .name=="mcp__github_inline_comment__create_inline_comment") | .id ] ) as $ids
            | [ .[] | select(.type=="user") | .message.content[]? |
                select(.type=="tool_result" and (.tool_use_id as $t | $ids | index($t) != null) and (.is_error // false)) ] | length
          ' "$EXECUTION_FILE")

          # --paginate applies --jq per page, so a review spanning multiple
          # comment pages would otherwise yield one value per page instead
          # of one total; --slurp wraps all pages into a single outer array
          # first. gh rejects --slurp combined with its own --jq, so pipe
          # to jq. set -euo pipefail makes a failed `gh api` (e.g. a later
          # page erroring after earlier pages succeeded) fail this whole
          # pipeline instead of jq quietly summarizing partial output.
          #
          # commit_id on a posted comment is whatever the model passed, not
          # something GitHub enforces - a model (honest or manipulated)
          # could target a different commit to dodge a commit_id filter. So
          # "this run's comments" is author + created_at (both outside the
          # model's control), and a commit_id mismatch is checked and
          # failed separately, below, rather than used to select rows.
          this_run=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR/comments" | \
            jq --arg start "$RUN_START" '[.[][] | select(.user.login == "claude[bot]" and .created_at >= $start)]')
          actual_total=$(jq 'length' <<<"$this_run")
          actual_correctness=$(jq '[.[] | select(.body | startswith("[correctness]"))] | length' <<<"$this_run")
          wrong_commit=$(jq --arg sha "$HEAD_SHA" '[.[] | select(.commit_id != $sha)] | length' <<<"$this_run")

          for n in "$actual_total" "$actual_correctness" "$wrong_commit" "$post_errors" "$CORRECTNESS_DECLARED" "$TOTAL_DECLARED"; do
            if ! [[ "$n" =~ ^[0-9]+$ ]]; then
              echo "::error::Could not compute an integer finding count (got '$n')."
              exit 1
            fi
          done
          echo "declared: correctness=$CORRECTNESS_DECLARED total=$TOTAL_DECLARED | actual posted this run: total=$actual_total correctness=$actual_correctness | wrong_commit=$wrong_commit | post_errors=$post_errors"

          failures=()
          [ "$CORRECTNESS_DECLARED" -gt 0 ] && failures+=("Claude's summary declared $CORRECTNESS_DECLARED correctness finding(s).")
          [ "$actual_correctness" -gt 0 ] && failures+=("$actual_correctness posted inline comment(s) from this run are tagged [correctness].")
          [ "$TOTAL_DECLARED" -gt "$actual_total" ] && failures+=("Claude's summary declared $TOTAL_DECLARED total finding(s) but only $actual_total inline comment(s) from this run were confirmed posted.")
          [ "$post_errors" -gt 0 ] && failures+=("$post_errors inline-comment post attempt(s) failed during the review - a finding may be missing.")
          [ "$wrong_commit" -gt 0 ] && failures+=("$wrong_commit posted comment(s) target a commit other than the captured head ($HEAD_SHA).")

          if [ "${#failures[@]}" -gt 0 ]; then
            printf '::error::%s\n' "${failures[*]} Fix the findings and comment /claude-review to request a re-review."
            exit 1
          fi
