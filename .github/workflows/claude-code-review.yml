name: Claude Code Review

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  # Resolves the actor's permission BEFORE the review job exists, so an
  # unauthorized `/claude-review` comment never joins claude-review's
  # concurrency group and can't cancel an in-flight legitimate run.
  authorize:
    if: |
      (
        github.event.pull_request &&
        github.actor != 'dependabot[bot]'
      ) ||
      (
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '/claude-review') &&
        github.actor != 'dependabot[bot]'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      authorized: ${{ steps.check.outputs.authorized }}
    steps:
      - name: Check commenter has write access
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # pull_request(opened) is scoped to the PR the actor themselves just
          # opened; the risk this job guards against - an outsider's comment
          # hijacking the concurrency group of someone else's running review -
          # only exists for issue_comment.
          if [ "$EVENT_NAME" != "issue_comment" ]; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq .permission)
          echo "commenter permission: $permission"
          if [ "$permission" = "admin" ] || [ "$permission" = "write" ]; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
          else
            echo "authorized=false" >> "$GITHUB_OUTPUT"
          fi

  claude-review:
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR: ${{ github.event.pull_request.number || github.event.issue.number }}
    concurrency:
      group: claude-review-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: React with eyes emoji
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'issue_comment') {
              await github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id,
                content: 'eyes'
              });
            } else if (context.eventName === 'pull_request' || context.eventName === 'pull_request_target') {
              await github.rest.reactions.createForIssue({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                content: 'eyes'
              });
            }

      # Captured once, used everywhere below (checkout, diff, the inline
      # comments' commit_id, and the final re-check) so a push mid-review
      # can't make the diff, the comments and the gate disagree about which
      # commit is under review. issue_comment carries no ref/SHA for the PR
      # at all - the ambient checkout ref would be main - and even for
      # pull_request the default ref is a synthetic merge-preview commit.
      - name: Resolve PR head and merge-base SHAs
        id: pr-sha
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! [[ "$PR" =~ ^[0-9]+$ ]]; then
            echo "::error::PR is not numeric: $PR"
            exit 1
          fi
          read -r head base < <(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid,baseRefOid --jq '.headRefOid + " " + .baseRefOid')
          for sha in "$head" "$base"; do
            if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Could not resolve a 40-char SHA for PR $PR (got: '$head' '$base')"
              exit 1
            fi
          done
          # GitHub's own PR diff is base...head (merge-base to head), not a
          # plain two-dot diff: if the base branch advanced after the PR
          # forked, base..head would include the base's own later commits
          # as if they were part of the PR. Ask GitHub for the merge-base
          # directly - one metadata field, not the file list or diff body,
          # so unlike generating the diff itself this call isn't subject to
          # the compare API's 300-file cap - rather than fetching a guessed
          # depth of history and hoping it's enough to compute it locally.
          merge_base=$(gh api "repos/$GITHUB_REPOSITORY/compare/$base...$head" --jq '.merge_base_commit.sha')
          if ! [[ "$merge_base" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve a merge-base SHA for PR $PR (got: '$merge_base')"
            exit 1
          fi
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "merge_base=$merge_base" >> "$GITHUB_OUTPUT"

      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.pr-sha.outputs.head }}
          fetch-depth: 1
          # persist-credentials stops actions/checkout from adding its own
          # token-bearing header; the action's own git setup still embeds a
          # token in .git/config's remote URL regardless (verified against
          # upstream git-config.ts - replaceCheckoutCredentials always sets
          # one unless the unrelated, and separately dangerous,
          # allowed_non_write_users input is set). That's why .git/** is
          # also denied to Read/Grep/Glob below - persist-credentials alone
          # does not close this off.
          persist-credentials: false

      # A trusted step fetches the merge-base commit and generates the diff
      # and changed-file list with git directly, pinned to the SHAs
      # captured above (not the live PR, which could have moved). GitHub's
      # compare API caps the file list at 300 and can truncate the diff
      # itself on a large PR, silently hiding files - git has no such cap.
      #
      # The fetch authenticates with a credential helper scoped to this one
      # git invocation (-c, never written to .git/config) that reads the
      # token from an env var already private to this step, rather than an
      # embedded-token URL: git still writes FETCH_HEAD, a reflog entry and
      # packed-refs for the fetched commit (object IDs and ref names, which
      # git itself sanitizes of credentials in those files), so "nothing is
      # written to disk" would be inaccurate - the credential specifically
      # is what stays out of any file, including .git/config. GIT_TRACE and
      # GIT_TRACE_CURL are explicitly unset because either would print the
      # helper's password output verbatim if somehow already set in the
      # environment.
      #
      # Output goes under a freshly created $RUNNER_TEMP directory, never a
      # PR-controlled path: the checked-out tree can contain a symlink at a
      # predictable name, and `>` follows symlinks, so a trusted write
      # through a PR-chosen path could be redirected to overwrite any
      # runner-writable file. mktemp's name isn't guessable in advance, so
      # nothing in the PR can pre-place one.
      - name: Write PR diff and changed-file list
        id: pr-context
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ steps.pr-sha.outputs.head }}
          MERGE_BASE: ${{ steps.pr-sha.outputs.merge_base }}
        run: |
          set -euo pipefail
          dir=$(mktemp -d "$RUNNER_TEMP/claude-review-context.XXXXXX")
          unset GIT_TRACE GIT_TRACE_CURL
          # shellcheck disable=SC2016 # $GH_TOKEN expands inside git's own credential-helper subshell, not here
          git -c credential.helper='!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' \
            fetch --depth 1 "https://${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git" "$MERGE_BASE"
          git diff "$MERGE_BASE" "$HEAD" > "$dir/diff.patch"
          git diff --name-only "$MERGE_BASE" "$HEAD" > "$dir/changed-files.txt"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      # Belt and braces on top of the claude_args flags below (which are the
      # actual enforcement): the SDK looks for project-level Claude config
      # in the current directory regardless of who's asking, so delete a
      # PR-supplied .claude/ (settings.json can define hooks - shell
      # commands that run on session start with this job's token in the
      # environment, no prompt injection needed), .mcp.json (a project MCP
      # server definition - also just a command the SDK spawns) and
      # CLAUDE.md/CLAUDE.local.md (loaded into context unconditionally; not
      # code, but still PR-controlled instruction text). The diff written
      # above already captured any changes to these paths as plain text, so
      # the review still sees that the PR touched them - deleting them here
      # only stops the SDK from loading them as live configuration.
      - name: Remove PR-controlled Claude config
        run: |
          find . \( -iname '.claude' -o -iname '.mcp.json' -o -iname 'CLAUDE.md' -o -iname 'CLAUDE.local.md' \) -exec rm -rf {} +

      # Ground truth for "did this run actually post anything" below: any
      # review comment by claude[bot] created at or after this timestamp is
      # from this run, regardless of what the model's own summary claims.
      - name: Record review start time
        id: run-start
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # The prompt is the review instructions directly, not a /code-review
      # slash command: the CLI's built-in skills (code-review included) are
      # never registered in the SDK's headless session that the action runs
      # (anthropics/claude-code#9954 - <available_skills> is empty outside
      # the interactive app), so a slash-command prompt matches no skill and
      # the run ends at num_turns: 0 with every tool call denied.
      #
      # allowedTools is the actual security boundary, not the prompt text,
      # and the model gets no Bash at all: a Bash rule scoped to `gh pr
      # comment <PR>` still lets `gh` itself read an arbitrary file via
      # `--body-file` or target another PR/repo via `--repo`/`--edit-last` -
      # none of that is stopped by restricting the PR number in the prefix,
      # since gh, not Claude's Read tool, does the reading. So there is no
      # comment-posting tool for the model at all; it can only post inline
      # findings (mcp__github_inline_comment__create_inline_comment - fixed
      # server-side to this PR's repo and number, no path/repo/PR
      # parameters it could redirect) and its plain final response becomes
      # the summary, posted and independently verified by trusted steps
      # below. Read/Grep/Glob remain, scoped away from .git/** so a token
      # can't be read back out (Claude Code applies Read deny rules to
      # Grep/Glob too); granted bare (no path scope), Read also reaches
      # $RUNNER_TEMP above despite that being outside the checkout.
      #
      # The category list here must match verdict.jq's `categories` below -
      # a tag outside this set fails the gate as malformed.
      #
      # --setting-sources/--settings/--strict-mcp-config close the actual
      # execution path the file-deletion step above only backstops: the SDK
      # defaults to loading project and local settings from the checked-out
      # PR (settingSources: user,project,local, confirmed in this action's
      # own run logs), and a project .claude/settings.json can define a
      # SessionStart hook - a shell command the SDK runs at session start,
      # in this job's environment (CLAUDE_CODE_OAUTH_TOKEN included), no
      # prompt injection or tool permission needed. Verified live and
      # locally, with the Claude Code CLI installed here, against a fixture
      # .claude/settings.json SessionStart hook and a fixture .mcp.json
      # server, each touching a marker file: the hook and the project MCP
      # server both fire with none of these three flags; neither fires with
      # them; an MCP server passed through this action's own --mcp-config
      # (which is how the inline-comment tool below is wired up) still
      # loads correctly under --strict-mcp-config, since that flag only
      # excludes servers from OTHER sources such as a project's .mcp.json
      # or (separately) the action's own setup-claude-code-settings.ts,
      # which unconditionally sets enableAllProjectMcpServers: true in the
      # user settings this job's Claude Code CLI reads.
      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          classify_inline_comments: 'false'
          prompt: |
            Review PR ${{ env.PR }} at high effort. Read ${{ steps.pr-context.outputs.dir }}/diff.patch for the full diff and ${{ steps.pr-context.outputs.dir }}/changed-files.txt for the list of changed files, then read whatever surrounding code and related files you need (Read, Grep, Glob) to catch correctness bugs, reuse/simplification opportunities, and efficiency issues. Investigate broadly - this is a high-effort pass, not a skim of the diff alone.

            For every finding, post an inline PR review comment on the exact line with mcp__github_inline_comment__create_inline_comment. Start each comment body with exactly one of these tags in square brackets, and nothing before it: [correctness], [reuse], [simplification], [efficiency], [altitude], [conventions]. Always pass commit_id: "${{ steps.pr-sha.outputs.head }}" on every call - never omit it and never use a different value.

            You have no tool to post a summary comment yourself. Instead, your FINAL message in this conversation - nothing before or after it - must be exactly the summary text, in this exact order:
            1. The heading '## Claude code review'
            2. The findings, grouped by category
            3. The line 'Fix the findings and comment /claude-review to request a re-review.'
            4. As the absolute final line of the message, and the only line anywhere in the message matching this shape: `<!-- findings: correctness=N total=M -->`, where N is the number of [correctness] findings and M is the total number of findings you posted (both 0 if none)
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Read(**/.git/**)"
            --setting-sources user
            --settings '{"disableAllHooks": true}'
            --strict-mcp-config

      # Trusted-side posting: the model's final response text becomes the
      # comment body verbatim (plus the run marker), posted with the
      # workflow's own token via --body-file, never a value the model
      # could turn into `--repo`/`--edit-last`/an arbitrary read. This is
      # only a light sanity check before posting - the strict findings
      # marker format is validated (and enforced) by the next step, so
      # there's one place that parses it rather than two.
      - name: Post review summary
        id: post-summary
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
          RUN_MARKER: "<!-- run:${{ github.run_id }} -->"
        run: |
          set -euo pipefail
          if [ -z "$EXECUTION_FILE" ] || [ ! -f "$EXECUTION_FILE" ]; then
            echo "::error::No execution output from Claude Code Review - nothing to post."
            exit 1
          fi
          result=$(jq '[.[] | select(.type == "result")] | last' "$EXECUTION_FILE")
          num_turns=$(jq -r '.num_turns // -1' <<<"$result")
          denials=$(jq -r '(.permission_denials // []) | length' <<<"$result")
          if [ "$num_turns" = "0" ]; then
            echo "::error::Claude Code completed 0 turns ($denials tool call(s) denied) - it never read the diff or posted a finding, so no summary can exist. Check --allowedTools covers every tool the review prompt uses."
            exit 1
          fi
          summary=$(jq -r '.result // ""' <<<"$result")
          if [ -z "$summary" ] || [[ "$summary" != "## Claude code review"* ]]; then
            echo "::error::Claude's final message wasn't a summary starting with '## Claude code review' - got: ${summary:0:200}"
            exit 1
          fi

          body_file=$(mktemp "$RUNNER_TEMP/claude-review-summary.XXXXXX")
          printf '%s\n\n%s\n' "$summary" "$RUN_MARKER" > "$body_file"
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$body_file"

      # Every gate rule lives in this one jq program so there's a single
      # place that parses the summary and the posted comments, instead of
      # several ad hoc bash comparisons that can each get an edge case
      # wrong (unbounded numbers, a marker that isn't really the summary's
      # last line, a mistagged comment silently not counting toward any
      # category). The bash around it only fetches inputs and checks the
      # single `pass` field - see the workflow's PR description for the
      # fixtures this program was tested against (clean pass, oversized
      # numbers, duplicate markers, a mistagged comment, and more).
      - name: Evaluate findings
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
          HEAD_SHA: ${{ steps.pr-sha.outputs.head }}
          RUN_START: ${{ steps.run-start.outputs.time }}
        run: |
          set -euo pipefail
          current_head=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          if [ "$current_head" != "$HEAD_SHA" ]; then
            echo "::error::PR changed during review (was $HEAD_SHA, now $current_head) - re-run /claude-review."
            exit 1
          fi

          summary=$(jq -r '[.[] | select(.type=="result")] | last | .result // ""' "$EXECUTION_FILE")

          # commit_id on a posted comment is whatever the model passed, not
          # something GitHub enforces - a model (honest or manipulated)
          # could target a different commit to dodge a commit_id filter. So
          # "this run's comments" is author + created_at (both outside the
          # model's control); a commit_id mismatch is its own gate failure
          # inside verdict.jq, not a filter on which rows are counted.
          #
          # --paginate applies --jq per page, so a review spanning multiple
          # comment pages would otherwise yield one value per page instead
          # of one total; --slurp wraps all pages into a single outer array
          # first. gh rejects --slurp combined with its own --jq, so pipe
          # to jq. set -euo pipefail makes a failed `gh api` (e.g. a later
          # page erroring after earlier pages succeeded) fail this whole
          # pipeline instead of jq quietly summarizing partial output.
          this_run_file=$(mktemp "$RUNNER_TEMP/claude-review-comments.XXXXXX")
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR/comments" | \
            jq --arg start "$RUN_START" '[.[][] | select(.user.login == "claude[bot]" and .created_at >= $start)]' \
            > "$this_run_file"

          verdict_file=$(mktemp "$RUNNER_TEMP/claude-review-verdict.XXXXXX.jq")
          cat > "$verdict_file" << 'JQ_EOF'
          def categories: ["correctness","reuse","simplification","efficiency","altitude","conventions"];

          # $comments and $exec arrive via --slurpfile, which always wraps a
          # file's top-level JSON value in a one-element array - unwrap
          # before use. --slurpfile (a file) rather than --argjson (a shell
          # command-line argument) avoids an ARG_MAX failure on a large
          # execution_file or a PR with many posted comments.
          ($comments_file[0]) as $comments
          | ($exec_file[0]) as $exec

          | ($summary | [scan("<!-- findings:[^>]*-->")]) as $all_markers
          | ($summary | rtrimstr("\n") | split("\n") | map(select(length > 0))) as $lines
          | ($lines[-1] // "") as $last_line
          | ($last_line | test("^<!-- findings: correctness=[0-9]{1,4} total=[0-9]{1,4} -->$")) as $marker_ok
          | (if (($all_markers | length) == 1) and $marker_ok then
               ($last_line | capture("correctness=(?<c>[0-9]{1,4}) total=(?<t>[0-9]{1,4})"))
             else null end) as $cap
          | (if $cap != null then ($cap.c | tonumber) else null end) as $correctness_declared
          | (if $cap != null then ($cap.t | tonumber) else null end) as $total_declared

          | ($comments | map(
              (.body // "") as $b
              | ($b | (capture("^\\s*[*_]{0,3}\\[(?<tag>[A-Za-z]+)\\]"; "i") // null)) as $tagcap
              | {
                  commit_id: .commit_id,
                  tag: (if $tagcap != null then ($tagcap.tag | ascii_downcase) else null end)
                }
            )) as $tagged
          | ($tagged | map(select(.tag == null or (.tag as $t | categories | index($t) | not)))) as $bad_tags
          | ($tagged | map(select(.tag == "correctness")) | length) as $correctness_posted
          | ($comments | length) as $total_posted
          | ($comments | map(select(.commit_id != $head)) | length) as $wrong_commit

          | ( [ $exec[] | select(.type=="assistant") | .message.content[]? |
                select(.type=="tool_use" and .name=="mcp__github_inline_comment__create_inline_comment") | .id ] ) as $ids
          | ( [ $exec[] | select(.type=="user") | .message.content[]? |
                select(.type=="tool_result" and (.tool_use_id as $t | $ids | index($t) != null) and (.is_error // false)) ]
              | length ) as $post_errors

          | [
              (if ($all_markers | length) != 1 then
                 "summary must contain exactly one findings marker (found \($all_markers|length))"
               else empty end),
              (if ($all_markers | length) == 1 and ($marker_ok | not) then
                 "the findings marker must be the final non-empty line, matching '<!-- findings: correctness=N total=M -->' exactly"
               else empty end),
              (if $cap != null and $correctness_declared > $total_declared then
                 "declared correctness (\($correctness_declared)) exceeds declared total (\($total_declared))"
               else empty end),
              (if ($bad_tags|length) > 0 then
                 "\($bad_tags|length) posted comment(s) have an unrecognized or malformed category tag"
               else empty end),
              (if $cap != null and $correctness_declared != $correctness_posted then
                 "declared correctness (\($correctness_declared)) does not match posted correctness comments (\($correctness_posted))"
               else empty end),
              (if $cap != null and $total_declared != $total_posted then
                 "declared total (\($total_declared)) does not match posted comments (\($total_posted))"
               else empty end),
              (if $correctness_posted > 0 then
                 "\($correctness_posted) posted inline comment(s) are tagged [correctness]"
               else empty end),
              (if $cap != null and $correctness_declared > 0 then
                 "summary declared \($correctness_declared) correctness finding(s)"
               else empty end),
              (if $post_errors > 0 then
                 "\($post_errors) inline-comment post attempt(s) failed (isError) during the review"
               else empty end),
              (if $wrong_commit > 0 then
                 "\($wrong_commit) posted comment(s) target a commit other than the captured head (\($head))"
               else empty end)
            ] as $reasons
          | {pass: ($reasons|length==0), reasons: $reasons}
          JQ_EOF

          verdict=$(jq -n --arg summary "$summary" \
            --slurpfile comments_file "$this_run_file" \
            --slurpfile exec_file "$EXECUTION_FILE" \
            --arg head "$HEAD_SHA" \
            -f "$verdict_file")

          echo "verdict: $verdict"
          if [ "$(jq -r '.pass' <<<"$verdict")" != "true" ]; then
            jq -r '.reasons[] | "::error::" + .' <<<"$verdict"
            echo "::error::Fix the findings and comment /claude-review to request a re-review."
            exit 1
          fi
